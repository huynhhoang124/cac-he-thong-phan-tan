x-node: &node
  build: .
  environment: &env
    DATA_DIR: /data
    ALLOWED_HOSTS: localhost,127.0.0.1,node-a,node-b,node-c

services:
  node-a:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node-a
      PEERS: http://node-b:8000,http://node-c:8000
    ports: ["8001:8000"]
    volumes: [node-a-data:/data]

  node-b:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node-b
      PEERS: http://node-a:8000,http://node-c:8000
    ports: ["8002:8000"]
    volumes: [node-b-data:/data]

  node-c:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node-c
      PEERS: http://node-a:8000,http://node-b:8000
    ports: ["8003:8000"]
    volumes: [node-c-data:/data]

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
