services:
  rabbitmq:
    # RabbitMQ 4 chan transient non-exclusive queue theo mac dinh.
    # De bai yeu cau durable=false, vi vay pin 3.13 cho dung kich ban KB2.
    image: rabbitmq:3.13-management
    container_name: th02-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:

